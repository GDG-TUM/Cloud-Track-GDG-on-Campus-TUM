<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Track | GDG on Campus TUM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cloud Track of GDG on Campus, Technical University of Mombasa. Learn it. Build it. Deploy it. Secure it.">
  <meta name="theme-color" content="#4285F4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #4285F4; }
    .sidebar { border-right: 1px solid #e8eaed; }
    .app-name-link { font-weight: 700; }
    .markdown-section { max-width: 920px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section img { vertical-align: middle; }
  </style>
</head>
<body>
  <div id="app">Loading Cloud Track...</div>

  <script>
    window.$docsify = {
      name: '☁️ Cloud Track',
      repo: 'GDG-TUM/cloud-track',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: 'Search the Cloud Track',
        noData: 'No results found.',
        depth: 3
      }
    };
  </script>

  <!-- Docsify core and plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Renders GitHub-style > [!NOTE], > [!TIP], > [!WARNING] boxes -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>
  <!-- Renders mermaid diagrams (timeline and flowcharts) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: true });</script>
</body>
</html>
